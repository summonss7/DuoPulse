<!doctype html>
<!-- Стенд смоука захвата паролей web-оверлея (карточка duopulse-165,
     e2e/mobile/pass-capture-smoke.mjs): форма логина как у обычного сайта —
     текстовое поле + пароль + кнопка (в <form>, сабмит перехватываем, чтобы
     страница никуда не уходила). Сценарий «без <form>» покрывают юнит-тесты
     пейлоада (src/mobile/pass-capture.test.ts). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — стенд duo 165</title>
<style>
  body { font: 16px system-ui; margin: 24px; }
  input { display: block; margin: 8px 0; padding: 10px; font: inherit; width: 240px; }
  button { padding: 10px 18px; font: inherit; }
  #log { margin-top: 16px; color: #666; }
</style>
</head>
<body>
<h3>Вход в аккаунт (стенд)</h3>
<form id="f" method="post" action="#">
  <input id="u" type="text" name="user" placeholder="Логин" autocomplete="username">
  <input id="p" type="password" name="pass" placeholder="Пароль" autocomplete="current-password">
  <button type="submit">Войти</button>
</form>
<div id="log">сабмитов: 0</div>
<script>
  var n = 0;
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    n++;
    document.getElementById("log").textContent = "сабмитов: " + n +
      " (последний: " + document.getElementById("u").value + ")";
    window.__dp165Submits = n;
  });
</script>
</body>
</html>
