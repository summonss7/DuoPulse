[package]
name = "duopulse"
version = "0.1.33"
description = "DuoPulse M0 spike: Tauri 2 + WebView2 против YouTube"
license = "GPL-3.0-only"
edition = "2021"

# Развилка бин/lib (duopulse-081, образец novagrid-058): десктоп собирается
# бином duopulse (main.rs со всей логикой браузера) и от lib НЕ зависит —
# cdylib/staticlib нужны только мобильным таргетам (Android .so через JNI
# для активити из gen/android), MinGW-линкер винды их не строит. Десктоп —
# `cargo build --bin duopulse`, `tauri android build` — только --lib
# (мобильная ветка src/lib.rs).
[lib]
name = "duopulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "duopulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# База без фич: нужна обеим веткам (бин десктопа и мобильная lib). Фича
# unstable (несколько webview в одном окне — таб-бар + контентные webview)
# включается только десктоп-секцией ниже: на Android API не работает, а
# фичи tauri компилируются и для мобильного таргета.
tauri = { version = "2", features = [] }
# Нативный выбор файла (панель субтитров «Свои субтитры…», задача 3.7:
# subtitles.load_file нужен абсолютный путь — HTML input в WebView2 даёт
# fakepath). Вызов — напрямую invoke("plugin:dialog|open"), без npm-пакета.
# Кросс-платформенный: регистрируется и мобильной веткой lib.rs (этап 2 —
# выбор файла своих субтитров на телефоне), capability default.json общая.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Разбор/проверка URL Duo-запросов (duo_mobile.rs: allowlist хостов fetch);
# маленький чистый крейт, обеим веткам. HTTP-клиент НЕ общий: ureq объявлен
# отдельно для десктопа и мобильных таргетов (рецепт NovaGrid — огромный
# cdylib-экспорт rustls/ring на Windows MinGW не тянет, либа десктопа тонкая).
url = "2"

# Десктоп-только (duopulse-081): вся логика бина main.rs — Windows/десктоп.
# На Android/iOS бин не собирается вовсе (tauri android build → --lib), а
# тянуть COM WebView2, DPAPI, движок блокировщика, WireGuard-стек и декодеры
# в мобильную lib незачем — этап 2 вынесет сюда переносимое ядро (парсеры
# субтитров, перевод, SQLite) по мере надобности.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# unstable: API нескольких webview в одном окне (WebviewBuilder/Window::add_child,
# AppHandle::get_webview/get_window) — нужен для схемы «UI-полоса + контентный webview».
tauri = { version = "2", features = ["unstable"] }
# Автообновление (задача 5.2): подписанные артефакты (minisign), каналы
# stable/canary, установка NSIS-пакета. Драйвится из Rust (src/updater.rs)
# по командам контракта updater.* — JS-API плагина не используется.
# Мобильная ветка обновляется своим путём (этап 3, duopulse-083: APK-манифест
# центра Aila + системная установка).
tauri-plugin-updater = "2"
# Одиночный экземпляр (карточка duopulse-119): ассоциация .pdf открывает
# файл в уже запущенном DuoPulse (argv форвардится вторым стартом), а не во
# втором процессе — профиль (SQLite/session.json) не переживает двух
# владельцев. Десктоп-only: мобильной ветке не нужен.
tauri-plugin-single-instance = "2"
# JSON Schema из Rust-типов: единый источник IPC-контракта bridge (задача 1.1,
# docs/05 §2) — из схем генерируются TS-типы (src/bridge/gen/types.ts).
schemars = "0.8"
# Прямой доступ к COM-API WebView2 (WebResourceRequested) для сетевого перехвата M0
# и BasicAuthentication (креды прокси, задача 1.8).
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI для пароля прокси (CryptProtectData; задача 1.8, docs/02 §9).
# GetProcessMemoryInfo — приватная память duopulse.exe для страницы
# «Диагностика» (задача 2.5, метрика P-03).
# System::Com::IStream + SHCreateMemStream — поток-обёртка тела ответа для
# подмены ответов WebResourceRequested ($replace, карточка duopulse-050).
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
# SQLite + FTS5: история и закладки (задачи 1.3–1.4) — файл duopulse.db
# в профиле (docs/02 §8), FTS5-индекс для omnibox-подсказок и поиска.
# bundled — SQLite собирается из исходников вместе с FTS5, без системных
# зависимостей.
rusqlite = { version = "0.31", features = ["bundled"] }
# Блокировщик рекламы (задача 2.1, docs/02 §3): движок Brave, синтаксис
# EasyList/uBO; сетевая фильтрация — из COM-перехватчика WebView2.
# default-features = false: дефолтные object-pooling/unsync-regex-caching
# делают Engine !Send/!Sync (Brave держит движок на каждый поток), а DuoPulse
# использует ОДИН движок для всех вкладок из COM-колбэков; embedded-domain-
# resolver и full-regex-handling сохранены (рекомендация апстрима).
adblock = { version = "0.9", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
# Пин транзитивной зависимости adblock (rmp-serde 0.15): rmp 0.8.15 убрал
# read_data_* и сломал сборку — держим последнюю совместимую.
rmp = "=0.8.14"
# Загрузка блок-листов по HTTPS (задача 2.1): блокирующий клиент без async-
# рантайма — обновление списков идёт в фоновой нити. tls — rustls с корнями
# webpki-roots (системное хранилище не требуется). socks-proxy — самофетч
# ответов для перезаписи ($replace, карточка duopulse-050) ходит тем же
# сетевым путём, что и WebView2: через локальный SOCKS5-роутер (задача 6.1).
# gzip — прозрачная декомпрессия самофетча (content-encoding срезаем, тело
# отдаётся со своей длиной): /player-ответы качаются сжатыми, критический
# путь плеера короче.
ureq = { version = "2", features = ["tls", "socks-proxy", "gzip"], default-features = false }
# Регексы $replace-правил перезаписи ответов (карточка duopulse-050);
# уже в дереве транзитивно (adblock full-regex-handling).
regex = "1"
# Разбор адресов фида обновлений (задача 5.2): url::Url требуется плагину
# апдейтера при подстановке канала в endpoints. (Крейт объявлен в общих
# зависимостях — с duopulse-082 его использует и мобильный Duo-движок.)
# Дата/время сборки в заголовке окна (карточка duopulse-078): форматирование
# unix-момента из build.rs в локальной зоне. Уже в дереве (транзитивно),
# без новых загрузок.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Потоковое чтение XML (задача 3.1): YouTube timedtext <transcript>/<timedtext>
# в src/subtitles/timedtext.rs; на битых документах возвращает ошибку события,
# а не паникует — парсер продолжает с диагностику (карточка duopulse-022).
quick-xml = "0.36"
# Клиент WireGuard (задача 6.2, docs/02 §6.3-B): boringtun — Noise IK
# handshake и ChaCha20-Poly1305-шифрование пакетов userspace, без TUN-драйвера
# и прав администратора (изоляция — src/vpn/wg.rs, смена реализации не трогает
# остальное; план Б — системный WireGuard/Wintun, ROADMAP).
boringtun = "0.7"
# TCP/IP-стек userspace поверх сессии WireGuard: роутер терминирует TCP-
# соединения WebView2 в smoltcp-сокетах, IP-пакеты ходят через туннель
# (medium-ip, без Ethernet; UDP-сокет — DNS через маршрут). Лицензия 0BSD.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    # Автоответ echo reply стека: серверная сторона (тестовый WG-стенд стенда
    # cargo-тестов) отвечает на ICMP-эхо пинга туннеля (задача 6.5) без
    # собственного ICMP-сокета; реальные WG-серверы отвечает их ОС.
    "auto-icmp-echo-reply",
    "proto-ipv4",
] }
# Настройка буферов UDP-сокета туннеля (SO_RCVBUF): дефолтных 64 КБ Windows
# не хватает на пачки сегментов TCP-окна — потери и ретрансмиссии (задача 6.2,
# замер пропускной способности). Уже в дереве (транзитивно), без новых загрузок.
socket2 = "0.6"
# Декодирование аудио для ASR (карточка duopulse-060): самофетч-байты аудио
# дорожки (m4a/AAC — основной путь YouTube-адаптера, mp3, wav, ogg/vorbis,
# flac) → PCM 16 кГц моно для whisper. Чистый Rust, без ffmpeg в поставке;
# лицензия MPL-2.0 (совместима с GPL-3.0 при использовании как зависимости).
# Ограничение: Opus-дорожки (webm) symphonia не декодирует — адаптер берёт
# m4a/AAC-итаг, «голое» видео webm/opus в v1 не поддержано.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "ogg",
    "pcm",
    "wav",
    "mp3",
    "vorbis",
    "flac",
] }
# Распаковка zip-движка whisper-server (карточка duopulse-060): mingw-сборка —
# это exe + 5 DLL (libgcc/libstdc++/libwinpthread/libgomp/libdl), релиз
# engine-whisper-1 пакует их одним архивом. Уже в дереве (транзитивно),
# без новых загрузок; deflate-only — больше zip'у в Core ничего не надо.
zip = { version = "4", default-features = false, features = ["deflate"] }
# Менеджер паролей/аккаунт Aila (duopulse-106/110): криптокрейты
# aes-gcm/rand/pbkdf2/hkdf/sha2 — чистый Rust (RustCrypto, без ring),
# объявлены сразу в двух ветках: здесь (десктоп-бин) и в мобильной секции
# ниже (пароли/синк на телефоне, этап 6 duopulse-112).
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
pbkdf2 = "0.12"
hkdf = "0.12"

# Мобильная ветка lib (duopulse-082; рецепт NovaGrid: сетевые зависимости
# мобильного пути живут ТОЛЬКО здесь — cdylib десктопа остаётся тонким,
# MinGW не тянет экспорт rustls/ring). ureq с rustls + вшитыми webpki-roots:
# системное хранилище/JNI не нужны (грабля NovaGrid с rustls-platform-
# verifier на Android сюда не переносится). quick-xml — парсер timedtext
# общего модуля subtitles, который мобильная lib компилирует для parse_auto.
# Этап 3 (duopulse-083): sha2 — сверка APK OTA-обновления; jni + ndk-context —
# системная установка APK через Kotlin-хелпер gen/android (контекст
# приложения кладёт tao, эталон novagrid-063).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ureq = { version = "2", features = ["tls"], default-features = false }
quick-xml = "0.36"
sha2 = "0.10"
jni = "0.21"
ndk-context = "0.1"
# Аккаунт Aila, синк и пароли мобильной ветки (этап 6 duopulse-112): те же
# чистые RustCrypto-крейты, что у десктопа (passwords/mod.rs + aila.rs),
# ring не нужен — тонкий экспорт cdylib сохраняется.
aes-gcm = "0.10"
rand = "0.8"
pbkdf2 = "0.12"
hkdf = "0.12"
# Закладки мобильной ветки (duopulse-104): то же хранилище history — SQLite
# (bundled — собирается NDK-cc из исходников, системная libsqlite не нужна),
# schemars — производные JsonSchema контрактных типов history/contract.rs.
rusqlite = { version = "0.31", features = ["bundled"] }
schemars = "0.8"

[dev-dependencies]
# Loopback-стенд WireGuard для маршрутных тестов (задача 6.6, карточка
# duopulse-042): сервер boringtun+smoltcp — один и тот же в cargo-тестах
# wg.rs и отдельным процессом wg-stand.exe в e2e/vpn (ранер его убивает —
# это «обрыв upstream» для kill-switch).
duopulse-wg-stand = { path = "../e2e/wg-stand" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
