[package]
name = "duopulse"
version = "0.1.0"
description = "DuoPulse M0 spike: Tauri 2 + WebView2 против YouTube"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: API нескольких webview в одном окне (WebviewBuilder/Window::add_child,
# AppHandle::get_webview/get_window) — нужен для схемы «UI-полоса + контентный webview».
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema из Rust-типов: единый источник IPC-контракта bridge (задача 1.1,
# docs/05 §2) — из схем генерируются TS-типы (src/bridge/gen/types.ts).
schemars = "0.8"
# Прямой доступ к COM-API WebView2 (WebResourceRequested) для сетевого перехвата M0
# и BasicAuthentication (креденшалы прокси, задача 1.8).
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI для пароля прокси (CryptProtectData; задача 1.8, docs/02 §9).
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
# SQLite + FTS5: история и закладки (задачи 1.3–1.4) — файл duopulse.db
# в профиле (docs/02 §8), FTS5-индекс для omnibox-подсказок и поиска.
# bundled — SQLite собирается из исходников вместе с FTS5, без системных
# зависимостей.
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
