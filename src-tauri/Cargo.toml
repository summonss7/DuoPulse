[package]
name = "duopulse"
version = "0.1.0"
description = "DuoPulse M0 spike: Tauri 2 + WebView2 против YouTube"
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: API нескольких webview в одном окне (WebviewBuilder/Window::add_child,
# AppHandle::get_webview/get_window) — нужен для схемы «UI-полоса + контентный webview».
tauri = { version = "2", features = ["unstable"] }
# Нативный выбор файла (панель субтитров «Свои субтитры…», задача 3.7:
# subtitles.load_file нужен абсолютный путь — HTML input в WebView2 даёт
# fakepath). Вызов — напрямую invoke("plugin:dialog|open"), без npm-пакета.
tauri-plugin-dialog = "2"
# Автообновление (задача 5.2): подписанные артефакты (minisign), каналы
# stable/canary, установка NSIS-пакета. Драйвится из Rust (src/updater.rs)
# по командам контракта updater.* — JS-API плагина не используется.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema из Rust-типов: единый источник IPC-контракта bridge (задача 1.1,
# docs/05 §2) — из схем генерируются TS-типы (src/bridge/gen/types.ts).
schemars = "0.8"
# Прямой доступ к COM-API WebView2 (WebResourceRequested) для сетевого перехвата M0
# и BasicAuthentication (креденшалы прокси, задача 1.8).
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI для пароля прокси (CryptProtectData; задача 1.8, docs/02 §9).
# GetProcessMemoryInfo — приватная память duopulse.exe для страницы
# «Диагностика» (задача 2.5, метрика P-03).
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# SQLite + FTS5: история и закладки (задачи 1.3–1.4) — файл duopulse.db
# в профиле (docs/02 §8), FTS5-индекс для omnibox-подсказок и поиска.
# bundled — SQLite собирается из исходников вместе с FTS5, без системных
# зависимостей.
rusqlite = { version = "0.31", features = ["bundled"] }
# Блокировщик рекламы (задача 2.1, docs/02 §3): движок Brave, синтаксис
# EasyList/uBO; сетевая фильтрация — из COM-перехватчика WebView2.
# default-features = false: дефолтные object-pooling/unsync-regex-caching
# делают Engine !Send/!Sync (Brave держит движок на каждый поток), а DuoPulse
# использует ОДИН движок для всех вкладок из COM-колбэков; embedded-domain-
# resolver и full-regex-handling сохранены (рекомендация апстрима).
adblock = { version = "0.9", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
# Пин транзитивной зависимости adblock (rmp-serde 0.15): rmp 0.8.15 убрал
# read_data_* и сломал сборку — держим последнюю совместимую.
rmp = "=0.8.14"
# Загрузка блок-листов по HTTPS (задача 2.1): блокирующий клиент без async-
# рантайма — обновление списков идёт в фоновой нити. tls — rustls с корнями
# webpki-roots (системное хранилище не требуется).
ureq = { version = "2", features = ["tls"], default-features = false }
# Разбор адресов фида обновлений (задача 5.2): url::Url требуется плагину
# апдейтера при подстановке канала в endpoints.
url = "2"
# Потоковое чтение XML (задача 3.1): YouTube timedtext <transcript>/<timedtext>
# в src/subtitles/timedtext.rs; на битых документах возвращает ошибку события,
# а не паникует — парсер продолжает с диагностику (карточка duopulse-022).
quick-xml = "0.36"
# Клиент WireGuard (задача 6.2, docs/02 §6.3-B): boringtun — Noise IK
# handshake и ChaCha20-Poly1305-шифрование пакетов userspace, без TUN-драйвера
# и прав администратора (изоляция — src/vpn/wg.rs, смена реализации не трогает
# остальное; план Б — системный WireGuard/Wintun, ROADMAP).
boringtun = "0.7"
# TCP/IP-стек userspace поверх сессии WireGuard: роутер терминирует TCP-
# соединения WebView2 в smoltcp-сокетах, IP-пакеты ходят через туннель
# (medium-ip, без Ethernet; UDP-сокет — DNS через маршрут). Лицензия 0BSD.
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "socket-tcp",
    "socket-udp",
    "proto-ipv4",
] }
# Настройка буферов UDP-сокета туннеля (SO_RCVBUF): дефолтных 64 КБ Windows
# не хватает на пачки сегментов TCP-окна — потери и ретрансмиссии (задача 6.2,
# замер пропускной способности). Уже в дереве (транзитивно), без новых загрузок.
socket2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
