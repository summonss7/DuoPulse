<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoPulse M0</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <div id="tabs" role="tablist" aria-label="Вкладки браузера"></div>
        <button id="newtab" title="Новая вкладка"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
      </div>
      <div id="navbar">
        <div class="logo">Duo<span>Pulse</span></div>
        <button id="back" class="icon-btn" title="Назад"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5M5 8h8.5"/></svg></button>
        <button id="fwd" class="icon-btn" title="Вперёд"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 11 8l-4.5 4.5M11 8H2.5"/></svg></button>
        <button id="reload" class="icon-btn" title="Обновить"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.7-3.75"/><path d="M13 2.8v2.7h-2.7"/></svg></button>
        <input id="omnibox" type="text" placeholder="Введите адрес или поисковый запрос" spellcheck="false" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" />
        <div id="suggest" class="suggest" hidden role="listbox" aria-label="Подсказки адресной строки"></div>
        <button id="go" class="go">Перейти</button>
        <button id="libBtn" class="icon-btn" title="История и закладки"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></button>
        <button id="proxyBtn" class="icon-btn" title="Прокси (VPN-инкремент A)"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8l5.2 2v3.5c0 3.2-2.2 5.5-5.2 7-3-1.5-5.2-3.8-5.2-7V3.8z"/></svg></button>
        <button id="mainBtn" class="icon-btn" title="Меню браузера"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><circle cx="8" cy="3.4" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="12.6" r="1.3"/></svg></button>
      </div>
      <div id="proxyMenu" class="proxy-menu" hidden>
        <div class="proxy-row proxy-head">
          <span class="proxy-title">Прокси</span>
          <label class="switch" title="Вкл/выкл прокси (применяется после перезапуска)">
            <input type="checkbox" id="proxyEnabled" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="proxy-row proxy-status" id="proxyStatus" data-state="off">
          <span class="dot"></span><span class="state"></span>
          <span class="detail" id="proxyStatusDetail"></span>
        </div>
        <div class="proxy-form">
          <label class="proxy-field">
            <span>Тип</span>
            <select id="proxyProto">
              <option value="socks5">SOCKS5</option>
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
            </select>
          </label>
          <label class="proxy-field grow">
            <span>Адрес</span>
            <input id="proxyHost" type="text" placeholder="127.0.0.1" spellcheck="false" autocomplete="off" />
          </label>
          <label class="proxy-field port">
            <span>Порт</span>
            <input id="proxyPort" type="number" min="1" max="65535" value="1080" />
          </label>
          <label class="proxy-field grow">
            <span>Логин</span>
            <input id="proxyLogin" type="text" placeholder="не обязательно" spellcheck="false" autocomplete="off" />
          </label>
          <label class="proxy-field grow">
            <span>Пароль&nbsp;<button type="button" id="proxyPassClear" class="link" hidden>удалить</button></span>
            <input id="proxyPassword" type="password" placeholder="пароль" autocomplete="new-password" />
          </label>
        </div>
        <div class="proxy-error" id="proxyError" hidden></div>
        <div class="proxy-actions">
          <button id="proxyCheck" class="ghost">Проверить</button>
          <button id="proxySave" class="primary">Сохранить</button>
        </div>
        <div class="proxy-restart" id="proxyRestartBlock" hidden>
          <span>Применяется после перезапуска браузера.</span>
          <button id="proxyRestart" class="primary">Перезапустить сейчас</button>
        </div>
        <div class="proxy-foot">
          Пароль хранится в DPAPI (не в settings.json). localhost и локальные адреса
          всегда идут напрямую.
          <button id="proxyIpEcho" class="link" title="Откроет api.ipify.org в браузере: при включённом прокси покажет адрес прокси">
            Проверить IP-эхом &rarr;
          </button>
        </div>
      </div>
      <div id="tabMenu" class="tab-menu" hidden>
        <button type="button" data-act="duplicate">Дублировать вкладку</button>
        <button type="button" data-act="sleep">Усыпить вкладку</button>
        <button type="button" data-act="close">Закрыть вкладку</button>
        <button type="button" data-act="closeOthers">Закрыть другие вкладки</button>
        <button type="button" data-act="reopen">Переоткрыть закрытую <span class="kbd">Ctrl+Shift+T</span></button>
      </div>
      <div id="mainMenu" class="main-menu" hidden>
        <button type="button" data-act="newtab">Новая вкладка</button>
        <button type="button" data-act="reopen">Переоткрыть закрытую <span class="kbd">Ctrl+Shift+T</span></button>
        <button type="button" data-act="history">История и закладки</button>
        <button type="button" data-act="diagnostics">Диагностика</button>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-row">
          <span class="menu-row-title">Блокировщик</span>
          <label class="switch" title="Вкл/выкл блокировщик рекламы">
            <input type="checkbox" id="adblockEnabled" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="menu-row menu-row-meta" id="adblockMeta">Заблокировано: 0</div>
        <button type="button" id="adblockSite" hidden>Отключить на этом сайте</button>
        <button type="button" id="adblockUpdate">Обновить списки</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" data-act="proxy">Прокси&hellip;</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
